[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    # starlette.testclient warns that it wants httpx2. That's starlette's
    # deprecation about *its* dependency, not anything this test suite does
    # wrong, and it fires on import so every module importing TestClient shows
    # it. Pinning it here keeps the real warnings visible instead of training
    # everyone to ignore the warnings summary.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
