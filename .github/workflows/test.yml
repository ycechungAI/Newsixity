name: Tests

# Runs on every push and PR. This replaced a stub that only echoed a message,
# which meant nothing was ever actually enforced — tests, lint, and types
# were green only for as long as someone kept them that way by hand.
on:
  push:
    branches: [hybrid, main, master]
  pull_request:
  workflow_dispatch: {}

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Confirm SQLite has FTS5
        # The search tests need it. init_fts5_search degrades gracefully
        # without FTS5, which would let that suite silently no-op rather than
        # fail — so assert it up front instead of chasing a phantom later.
        run: |
          python - <<'PY'
          import sqlite3
          sqlite3.connect(":memory:").execute("CREATE VIRTUAL TABLE t USING fts5(x)")
          print("FTS5 available on SQLite", sqlite3.sqlite_version)
          PY

      - name: Install backend
        run: pip install -e "backend/.[dev,integrations]"

      # test_static_routes.py exercises the SPA fallback and the /api 404
      # catch-all against the real built frontend, so dist/ has to exist.
      # It is gitignored, so a fresh checkout has none and those 14 tests
      # fail on a missing index.html. Skipping them instead would leave the
      # catch-all untested — and a missing-route bug returning index.html at
      # status 200 is exactly what shipped four broken features.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build frontend (needed by the static-route tests)
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        # --max-warnings=0: the project is at zero, and a warning left to
        # accumulate is exactly how the Fast Refresh one survived several
        # versions unnoticed.
        run: npx eslint --max-warnings=0

      - name: TypeScript
        # At 0 errors. It was at 20, and they were hiding a real bug
        # (PrunePreview missing a field the API actually returns).
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  frontend-node-next:
    # Forward-compat canary: the same checks on the next Node major, so a
    # breaking change shows up here before 26 becomes the supported base.
    # Advisory only (continue-on-error) — it never gates a merge. When 26
    # goes LTS, move it to .nvmrc and put 28 here.
    name: Frontend on Node 26 (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # engines is ">=24", so 26 passes engine-strict without an override.
      - run: npm ci

      - run: npx eslint --max-warnings=0

      - run: npx tsc --noEmit

      - run: npm run build

  api-contract:
    name: API contract (frontend calls vs backend routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e "backend/.[dev,integrations]"

      - name: Every /api/* the frontend calls must exist
        # Its own job so the failure is unmissable in the checks list. A
        # missing route does not fail at runtime — the static catch-all used
        # to answer with index.html at status 200 — and four features shipped
        # broken that way before this check existed.
        run: python -m pytest backend/tests/integration/test_api_contract.py -q
