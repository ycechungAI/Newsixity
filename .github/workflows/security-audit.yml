name: Security Audit

on:
  pull_request:
  push:
    # `hybrid` is this repo's default branch. Listing only main/master meant
    # this workflow never ran on a push — it had effectively been dormant.
    branches:
      - hybrid
      - main
      - master
  schedule:
    - cron: "0 10 * * 1"

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod
