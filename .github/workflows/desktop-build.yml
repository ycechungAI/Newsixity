name: Desktop app build

# Builds the Tauri desktop app for macOS, Windows, and Linux. Each runner
# freezes the backend for its own platform (PyInstaller doesn't cross-compile)
# and produces its native installer format(s) via `tauri build --target all`
# (dmg/app on macOS, msi/nsis on Windows, deb/appimage on Linux).
#
# CI builds ship WITHOUT the seed database: data/newsixity.db is gitignored
# (it's the maintainer's live reading data, never committed), so these builds
# start with an empty DB that populates on first RSS refresh. Local builds via
# ./backend/build_sidecar.sh still bundle the seed automatically when present.
#
# Manual trigger only for now (workflow_dispatch) — wire up push/tag triggers
# once the release process is decided.

on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri v2 requirements)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Create Python venv and install backend deps
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
          else
            source .venv/Scripts/activate
          fi
          pip install -U pip
          pip install -e "./backend[integrations,desktop]"

      - name: Build sidecar (frontend + frozen backend)
        shell: bash
        run: ./backend/build_sidecar.sh

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newsixity-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
