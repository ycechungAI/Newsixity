name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Linux package to build
        required: true
        default: arch
        type: choice
        options:
          - arch
          - ubuntu
          - all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arch
            name: linux-arch-x64
            artifact_path: src-tauri/target/release/bundle/appimage/Newsixity-*.AppImage
          - target: ubuntu
            name: linux-ubuntu-x64
            artifact_path: src-tauri/target/release/bundle/deb/*.deb

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: matrix.target == 'ubuntu' && (inputs.target == 'all' || inputs.target == 'ubuntu')
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        if: matrix.target == 'ubuntu' && (inputs.target == 'all' || inputs.target == 'ubuntu')
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        if: matrix.target == 'ubuntu' && (inputs.target == 'all' || inputs.target == 'ubuntu')
        uses: dtolnay/rust-toolchain@stable

      - name: Build Arch Linux AppImage
        if: matrix.target == 'arch' && (inputs.target == 'all' || inputs.target == 'arch')
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              # GitHub Docker containers cannot mount FUSE AppImages.
              # The Tauri linuxdeploy helper supports self-extraction instead.
              export APPIMAGE_EXTRACT_AND_RUN=1
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed \
                base-devel curl file git nodejs npm openssl patchelf python \
                python-pip rustup wget webkit2gtk-4.1 libappindicator librsvg \
                gst-plugins-base
              rustup default stable
              npm ci
              python -m venv .venv
              . .venv/bin/activate
              python -m pip install -e "./backend[integrations,desktop]"
              ./build-linux-arch.sh
            '

      - name: Build Ubuntu package
        if: matrix.target == 'ubuntu' && (inputs.target == 'all' || inputs.target == 'ubuntu')
        shell: bash
        run: |
          # Chrome is not needed; omitting its occasionally stale repository
          # keeps the runner's package update reliable.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf wget
          npm ci
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -e "./backend[integrations,desktop]"
          ./build-linux-ubuntu.sh

      - name: Upload artifact
        if: (matrix.target == 'arch' && (inputs.target == 'all' || inputs.target == 'arch')) || (matrix.target == 'ubuntu' && (inputs.target == 'all' || inputs.target == 'ubuntu'))
        uses: actions/upload-artifact@v4
        with:
          name: newsixity-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
